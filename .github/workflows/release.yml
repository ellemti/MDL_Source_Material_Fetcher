name: Release

# Triggers when you push a version tag, e.g.:
#   git tag v0.2.0
#   git push origin v0.2.0
# This builds the exe on Windows and attaches it to a new GitHub
# Release named after the tag -- exactly what the app's built-in
# "Check for Updates" button looks for.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pyinstaller

      - name: Run tests
        run: pytest -v

      - name: Build executable
        run: |
          pyinstaller --noconfirm SourceMaterialFetcher.spec

      - name: Get version from tag
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          echo "version=$v" >> $env:GITHUB_OUTPUT

      - name: Create portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path portable | Out-Null
          Copy-Item dist\SourceMaterialFetcher.exe portable\
          Copy-Item README.md, LICENSE portable\
          Compress-Archive -Path portable\* -DestinationPath "SourceMaterialFetcher-${{ steps.ver.outputs.version }}-portable.zip"

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ steps.ver.outputs.version }}" installer.iss

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/SourceMaterialFetcher.exe
            SourceMaterialFetcher-${{ steps.ver.outputs.version }}-portable.zip
            installer_output/SourceMaterialFetcher-Setup-${{ steps.ver.outputs.version }}.exe
          generate_release_notes: true
